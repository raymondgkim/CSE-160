<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Virtual World – Phong Lighting</title>
    <style>
      body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; }
      canvas { display: block; cursor: crosshair; }

      #hud {
        color: #fff; font-family: monospace; font-size: 13px;
        background: rgba(0,0,0,0.5); padding: 4px 8px;
        display: flex; justify-content: space-between;
        width: 800px; box-sizing: border-box;
      }

      #controls {
        color: #ddd; font-family: monospace; font-size: 12px;
        background: rgba(0,0,0,0.6); padding: 6px 10px;
        width: 800px; box-sizing: border-box;
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      }

      #controls label { font-size: 11px; }

      button {
        background: #333; color: #eee; border: 1px solid #666;
        padding: 3px 10px; cursor: pointer; font-family: monospace; font-size: 12px;
        border-radius: 3px;
      }
      button:hover { background: #555; }
      button.active { background: #2a6; border-color: #4d4; color: #fff; }

      input[type=range] { width: 110px; cursor: pointer; }
      input[type=color]  { width: 36px; height: 22px; padding: 0; border: none; cursor: pointer; background: none; }

      #instructions {
        color: #ccc; font-family: monospace; font-size: 12px;
        background: rgba(0,0,0,0.6); padding: 4px 8px;
        width: 800px; box-sizing: border-box; text-align: center;
      }
    </style>
  </head>
  <body onload="main()">
    <canvas id="webgl" width="800" height="600">
      Please use a browser that supports "canvas"
    </canvas>

    <div id="hud">
      <span>FPS: <span id="fpsDisplay">0</span></span>
      <span>Pos: <span id="posDisplay">0, 0, 0</span></span>
      <span>Look: <span id="lookDisplay">0</span></span>
    </div>

    <div id="controls">
      <!-- Lighting toggles -->
      <button id="btnLighting"   onclick="toggleLighting()"        class="active">Lighting ON</button>
      <button id="btnNormals"    onclick="toggleNormals()"                       >Normals OFF</button>
      <button id="btnPointLight" onclick="togglePointLight()"      class="active">Point Light ON</button>
      <button id="btnSpotLight"  onclick="toggleSpotLight()"                     >Spot Light OFF</button>

      <!-- Point-light position slider -->
      <label>Light X:
        <input type="range" id="sliderLightX" min="0" max="32" step="0.1" value="16"
               oninput="g_lightPos[0]=+this.value">
      </label>
      <label>Light Y:
        <input type="range" id="sliderLightY" min="0" max="20" step="0.1" value="8"
               oninput="g_lightPos[1]=+this.value">
      </label>
      <label>Light Z:
        <input type="range" id="sliderLightZ" min="0" max="32" step="0.1" value="16"
               oninput="g_lightPos[2]=+this.value">
      </label>

      <!-- Light colour -->
      <label>Light Color:
        <input type="color" id="lightColor" value="#ffffff"
               oninput="updateLightColor(this.value)">
      </label>
    </div>

    <div id="instructions">
      WASD = Move &nbsp;|&nbsp; Q/E = Pan Left/Right &nbsp;|&nbsp;
      F = Add Block &nbsp;|&nbsp; R = Remove Block &nbsp;|&nbsp;
      Click canvas to capture mouse
    </div>

    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix.js"></script>
    <script src="camera.js"></script>
    <script src="Model.js"></script>
    <script src="asg4.js"></script>
  </body>
</html>
